name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: git diff --exit-code
      - run: flutter analyze
      - run: flutter test

  android-build:
    name: Android builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - name: Dev debug APK
        run: flutter build apk --flavor dev --debug
      - name: Prod release bundle
        run: flutter build appbundle --flavor prod --release

  ios-build:
    name: iOS builds
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - name: Dev debug, no codesign
        run: flutter build ios --flavor dev --debug --no-codesign
      - name: Prod release, no codesign
        run: flutter build ios --flavor prod --release --no-codesign

  android-e2e:
    name: Android end to end
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          emulator-boot-timeout: 600
          script: bash tool/android_e2e.sh

  ios-e2e:
    name: iOS end to end
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - name: Boot a simulator
        run: |
          xcrun simctl list devices available
          DEVICE=$(xcrun simctl list devices available | grep -E "iPhone" | head -1 | sed -E 's/.*\(([A-F0-9-]+)\).*/\1/')
          echo "SIMULATOR=$DEVICE" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE"
      - name: Guest flow
        run: flutter test integration_test -d "$SIMULATOR"
