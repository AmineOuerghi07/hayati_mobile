name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    name: Analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.50.0
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - run: git diff --exit-code
      - run: flutter analyze
      - run: flutter test
