name: hayati
description: "Hayati habit tracker for iOS and Android."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # Newest Riverpod release that builds on Dart 3.11 (this Flutter SDK).
  # Riverpod 3.4 and later require Dart 3.12.
  flutter_riverpod: 3.3.1
  go_router: ^17.5.0
  intl: 0.20.2
  riverpod_annotation: 4.0.2

dev_dependencies:
  build_runner: ^2.11.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: 4.0.3

flutter:
  generate: true
  uses-material-design: true
  default-flavor: dev
  fonts:
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-Bold.ttf
          weight: 700
